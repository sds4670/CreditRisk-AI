# Render Deployment Blueprint for CreditRisk AI FastAPI Web Service
services:
  - type: web
    name: creditrisk-ai-api
    env: python
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: CREDITRISK_API_KEY
        generateValue: true
