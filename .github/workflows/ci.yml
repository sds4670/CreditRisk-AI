name: CreditRisk AI CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify:
    name: Build & Verify Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download HMEQ Dataset
        run: |
          mkdir -p data/raw
          curl -L -o data/raw/hmeq.csv "https://raw.githubusercontent.com/sassoftware/sas-viya-dmml-pipelines/master/data/hmeq.csv"

      - name: Train Production XGBoost Model
        run: |
          python scripts/train_model.py --dataset data/raw/hmeq.csv --models xgboost

      - name: Generate Model Comparison Benchmark Artifacts
        run: |
          python scripts/compare_models.py --dataset data/raw/hmeq.csv

      - name: Generate TreeSHAP Explainability Artifacts
        run: |
          python scripts/verify_phase3.py

      - name: Generate Portfolio ECL & Risk Analytics Artifacts
        run: |
          python scripts/run_portfolio_analysis.py

      - name: Verify Phase 5 Dashboard & Artifact Integrity
        run: |
          python scripts/verify_phase5.py

      - name: Verify Phase 6 API & Infrastructure
        run: |
          python scripts/verify_phase6.py

      - name: FastAPI API Smoke Test
        run: |
          python -c "from api.main import app; print('FastAPI app loaded successfully!')"

      - name: Verify Streamlit App Syntax
        run: |
          python -c "import streamlit_app; print('Streamlit app imported successfully!')"

